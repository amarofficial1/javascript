<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Employee Registration</h1><br>
    <label>Employee Name:</label><br>
    <input type="text" id="name" required><br><br>
    <label >Employee Salary:</label><br>
    <input type="text" id="salary" required>
    <br><br>
    <input type="submit" value="Add Employee" onclick="add()">
    <h2>Employee details</h2>
    <div id="out"></div>
    <script>
        const emp= new Map()

        add=()=>
    {
        x=document.getElementById("name").value
        y=document.getElementById("salary").value
        emp.set("empname",{x,y})
        z=document.getElementById("out")
        a=document.createElement("p")
        a.innerHTML=emp.get("empname").x +" : " + emp.get("empname").y
        z.appendChild(a)
    }

    </script>
</body>
</html>
