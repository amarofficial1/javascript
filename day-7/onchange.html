<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <label>Name: </label>
    <input type="text" onchange="change()">
    <p id="name"></p>
    <script>
        function change()
        {
            e=event.target.value
            document.getElementById("name").innerHTML=e
        }
    </script>
</body>
</html>
