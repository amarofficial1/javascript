<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1 id="hd">Welcome</h1>
    <input type="button" value="Change Text" onclick="ch()">
    <script>
        ch = () => {
            if (document.getElementById("hd").innerHTML == "Welcome") {
                document.getElementById("hd").innerHTML = "JavaScript is Fun!"
            }
            else {
                document.getElementById("hd").innerHTML = "Welcome"
            }

        }

    </script>

</body>

</html>
