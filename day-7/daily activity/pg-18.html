<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
      <label>Product Price:</label>
    <input type="text" placeholder="Enter the product price." id="n">
     <br><br><label>Product Quantity:</label>
    <input type="text" placeholder="Enter the Quantity." id="n1">
   <br> <br><input type="button" value="Total amount" onclick="bill()">
    <p id="out"></p>
    <script>
        bill=()=>
    {
        try
        {
            x=Number(document.getElementById("n").value)
            y=Number(document.getElementById("n1").value)
            total=x*y
            if(total>5000)
            total=total- ((total/100)*10)
        document.getElementById("out").innerHTML=" The total bill is ₹"+total
        }
        catch (error)
        {
            console.log(error)
        }
    }
    </script>
</body>
</html>
