<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Enter the first Number: </h2>
    <input type="text" placeholder="enter a number." required id="1st">
    <h2>Enter the Second Number: </h2>
    <input type="text" placeholder="enter a number." required id="2nd">
    <br><br>
    <input type="button" value="Add" onclick="add()">
    <p id="result"></p>
    <script>
       function add()
        {
            x=Number(document.getElementById("1st").value)
            y=Number(document.getElementById("2nd").value)
            s=x+y
            document.getElementById("result").innerHTML="sum= "+s
        }
    </script>
</body>
</html>
