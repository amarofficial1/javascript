<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        //pg71
        x=1
        document.write("<br><br>Month Number= "+x)
        if(x>=3 && x<=5)
        document.write("<br>Summer ")
    else if (x>=6 && x<=9)
        document.write("<br>Monsoon ")
        else if(x>=10 && x<=11 )
        document.write("<br>Autumn")
    else if (x==12 || x==1 || x==2)
        document.write("<br>winter ")

        //pg72
        x=1000
        document.write("<br><br>Purchase Amount = "+x)
        if(x>1000)
        document.write("<br>No discount ")
    else if (x>=1000 && x<=4999)
        document.write("<br>5% discount")
        else if(x>=5000 && x<=9999 )
        document.write("<br>10%")
    else if (x>=20000)
        document.write("<br>20% ")

        //pg73
        x=-13
        document.write("<br><br>Number= "+x)
        if(x>0 && x%2==0)
        document.write("<br>"+x+" is a positive even number.")
    else if(x<0 && x%2==0)
        document.write("<br>"+x+" is a negative even number.")
    else if(x>0 && x%2==1)
        document.write("<br>"+x+" is a positive odd number.")
    else if(x<0 && x%2==-1)
        document.write("<br>"+x+" is a negative odd number.")
        else if(x==0)
        if(x>0 && x%2==0)
        document.write("<br>"+x+" is a positive even number.")
    else if(x==0)
        document.write("<br>"+x+" is zero")

         //pg74
        x=10
        document.write("<br><br>Experience = "+x)
        if(x<1)
        document.write("<br>No bonus")
    else if (x>=1 && x<=3)
        document.write("<br>5% ")
        else if(x>=4 && x<=6 )
        document.write("<br>10%")
    else if (x>=7 && x<=10)
        document.write("<br>15% ")
    else if(x>10)
        document.write("<br>20%")


        //pg75
        x=40
        y=50
        z=60
        a=(x+y+z)/3
        document.write("<br><br>Marks on sub1= "+x)
        document.write("<br>Marks on sub2= "+y)
        document.write("<br>Marks on sub3= "+z)
        document.write("<br>Average Marks= "+a)
        document.write("<br>Grade=")
        if(x>=35 && y>=35 && z>=35)
        {  
            if(x>=90)
            document.write("<br> Distinction")
        else if(x>=75 && x<=89)
            document.write("<br> First class")
        else if(x>=60 && x<=74)
            document.write("<br> Second class")
        else if(x>=35 && x<=59)
            document.write("<br>pass")
        }
        else
            document.write("<br>failed")

        //pg76
        z=5
        document.write("<br><br> Number= "+z)
        switch(z)
        {
            case 1:
                document.write("<br>Sunday")
                break
            case 2:
                document.write("<br>Monday")
                break
            case 3:
                document.write("<br>Tuesday")
                break
            case 4:
                document.write("<br>Wednesday")
                break
            case 5:
                document.write("<br>Thursday")
                break
            case 6:
                document.write("<br>Friday")
                break
            case 7:
                document.write("<br>Saturday")
            default:
                break
        }    

        //pg77
        x=5
        y=6
        document.write("<br> x= "+x)
        document.write("<br> y= "+y)
        z="*"
        document.write("<br> Operand= "+z)
        switch(z)
        {
            case '+':
                document.write("<br>sum= "+x+y)
                break
            case '-':
                document.write("<br>Difference= "+x-y)
                break
            case '*':
                document.write("<br>Multiplication= "+x*y)
                break
            case '/':
                document.write("<br>Quotient= "+x/y)
                break           
            case '%':
                document.write("<br>Remainder= "+x%y)
                break
                
            default:
                break
        }

        //pg78
        z=5
        document.write("<br><br>Month Number= "+z)
        switch(z)
        {
            case 1:
                document.write("<br>January")
                break
            case 2:
                document.write("<br>February")
                break
            case 3:
                document.write("<br>March")
                break
            case 4:
                document.write("<br>April")
                break
            case 5:
                document.write("<br>May")
                break
            case 6:
                document.write("<br>June")
                break
            case 7:
                document.write("<br>July")
            case 8:
                document.write("<br>August")
                break
            case 9:
                document.write("<br>September")
                break
            case 10:
                document.write("<br>October")
                break
            case 11:
                document.write("<br>November")
                break
            case 12:
                document.write("<br>December")
            default:
                break
        }    

        //pg79
        x="red"
        document.write("<br><br> color= "+x)
        switch(x)
        {
            case 'red':
                document.write("<br>Stop ")
                break
            case 'yellow':
                document.write("<br>Get Ready")
                break
            case 'green':
                document.write("<br> Go")
                break
            default:
                break
        }

        //pg80
        z='e'
        document.write("<br><br>Alphabhet= "+z)
        switch(z)
        {
            case 'a':
                document.write("<br>It is a vowel")
                break
            case 'e':
                document.write("<br>It is a vowel")
                break
            case 'i':
                document.write("<br>It is a vowel")
                break
            case 'o':
                document.write("<br>It is a vowel")
                break
            case 'u':
                document.write("<br>It is a vowel")
                break
            default:
                document.write("<br>It is a consonant.")
                break
        }    
    </script>
</body>
</html>
