<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>create elements using js</title>
</head>
<body>
    <div id="temp"></div>
    <p>Javascript is a language designed for browser.Browser can only identify htm,css & html</p>
    <script>
        e1=document.createElement("h1")
        e1.textContent="Javascript"
        y=document.getElementById("temp")
        y.appendChild(e1)
    </script>
</body>
</html>
