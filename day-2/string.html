<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        st="hi am amar"
        document.write(st[1])
        document.write("<br>the length of string=",st.length)
        document.write("<br>the slice=",st.slice(2,6))

        y="good everyone"
        document.write("<br>")
        a=y.substring(1,5)
        document.write(a)
        document.write("<br>",y.charAt(0))
        b=y.slice(7)
        document.write("<br>",b)
        document.write("<br>",y.slice(0,4)+y.slice(10,13))


    </script>
</body>
