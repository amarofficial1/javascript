<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        a=3 //a is the coefficient of x^2
        b=4 //b is the coefficient of x
        c=5 // c is the constant term
        s=(b**2-4*a*c)
        if(s<0)
        s=-(s)
        x=(-b+(s)**0.5)/(2*a)
        y=(-b-(s)**0.5)/(2*a)
        document.write("<br> a= "+a)
        document.write("<br> b= "+b)
        document.write("<br> c= "+c)
        document.write("<br><br> ")
        document.write("<br><br> Square roots are = "+x)
        document.write("<br><br> Square roots are = "+y)
    </script>
</body>
</html>
