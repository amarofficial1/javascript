<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Courses</title>
</head>
<body>
    <div id="rad"></div>
    <script>
        a=document.createElement("input")
        a.type='radio'
        a.name='review'
        a.value="good"
        x=document.createElement("label")
        x.innerHTML="good"
        b=document.createElement("input")
        b.type='radio'
        b.name='review'
        b.value="average"
         y=document.createElement("label")
        y.innerHTML="average"
        c=document.createElement("input")
        c.type='radio'
        c.name='review'
        c.value="bad"
         z=document.createElement("label")
        z.innerHTML="bad"
        e=document.getElementById("rad")
        e.appendChild(a)
        e.appendChild(x)
        e.appendChild(b)
        e.appendChild(y)
        e.appendChild(c)
        e.appendChild(z)



    </script>
</body>
</html>
