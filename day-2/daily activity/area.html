<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <Script>
        s=5
        l=4
        b=3
        h=6
        b2=3
        r=4
        document.write("The value of side is: ", s);
        document.write("<br>The value of length is: ", l);
        document.write("<br>The value of breadth is: ", b);
        document.write("<br>The value of height is: ", h);
        document.write("<br>The value of base is: ", b2);
        document.write("<br>The value of radius is: ", r);
        square=s*s
        rectangle=l*b
        triangle=0.5*b2*h
        circle=3.14*r*r
        document.write("<br><br>The area of square is: ", square);
        document.write("<br>The area of rectangle is: ", rectangle);
        document.write("<br>The area of triangle is: ", triangle);
        document.write("<br>The area of circle is: ", circle);
    </Script>
</body>
</html>
