<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <Script>
        s=5
        l=4
        b=3
        h=6
        b2=3
        r=4
        d=8
        document.write("The value of side is: ", s);
        document.write("<br>The value of length is: ", l);
        document.write("<br>The value of breadth is: ", b);
        document.write("<br>The value of height is: ", h);
        document.write("<br>The value of base is: ", b2);
        document.write("<br>The value of radius is: ", r);
        document.write("<br>The value of third side is: ", d);
        square=4*s
        rectangle=2*(l+b)
        triangle=b2+h+d
        circle=2*3.14*r
        document.write("<br><br>The perimeter of square is: ", square);
        document.write("<br>The perimeter of rectangle is: ", rectangle);
        document.write("<br>The perimeter of triangle is: ", triangle);
        document.write("<br>The perimeter of circle is: ", circle);
    </Script>
    </Script>
</body>
</html>
