<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let st="Hi all have a very bad day"
        document.write(st.toLowerCase())
        document.write("<br>",st.toUpperCase())
        document.write("<br>",st.split('all'))
        document.write("<br>",st.search(/all /g))
        document.write("<br>",st.replace(/all /g,"nice "))
        a='amar'
        b='shah'

        document.write("<br>",a.concat(" ",b))


    </script>
</body>
</html>
