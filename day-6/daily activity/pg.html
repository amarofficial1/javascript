       //pg to create functions based on arithmatic operations and use switch to call it 
       function add(x,y)
       {
        a=x+y

        function sub(x,y)

       }

        document.write("<br>Product= "+a)
       }

       }

        document.write("<br>Remainder= "+a)
       }

       x=5
       y=6
       document.write("<br><br> x= "+x)
       document.write("<br> y= "+y)
       z="*"
       document.write("<br> Operator= "+z)
       switch(z)
       {
        case '+':
            add(x,y)
            break
        case '-':
            sub(x,y)
            break
        case '*':
            mult(x,y)
            break
        case '/':

            break
        case '%':

            break
        default:
