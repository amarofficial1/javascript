        // for loop for array

        a=[2,4,6,8,10]

    {

    // find the sum of elements of array using for of;

    {
     s=s+i
    }
     document.write('<br>Sum= '+s)

    document.write("<br><br>2D Array= ")

    {
        document.write("<br>")
        for(j=0;j<4;j++)
    {
        document.write(" "+a[i][j])
    }
    }
    
    
    //sum of diagonals in 2d array
    a=[[1,2,3],[3,4,5],[7,8,9]] //initializing 2d array
    document.write("<br><br>2D Array= ")
    s=0
    for(i=0;i<3;i++)
    {
        document.write("<br>")
        for(j=0;j<3;j++)
    {
        document.write(" "+a[i][j])
        if(i==j)
        s=s+a[i][j]
    }
    }
    document.write("<br><br>sum of diagonals= "+s)
    

    //transpose of 2d matrix
    a=[[2,4,6],[8,10,12]]
    b=[[],[],[]]
    document.write("<br><br>Array A = ")
    for(i=0;i<2;i++)
    {
        document.write("<br>")
        for(j=0;j<3;j++)
    {
        document.write(" "+a[i][j])
    
    }
    }
    for (i = 0; i < 3; i++) 
    {
        for ( j = 0; j < 2; j++) 
        {
        b[i][j] = a[j][i]; 
        }
}
document.write("<br><br>Transposed Array B= ");
for (i = 0; i < 3; i++) {
    document.write("<br>");
    for (j = 0; j < 2; j++) {
        document.write(" " + b[i][j]);
    }
}
