<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let x=20
        document.write("<br>The value of x= ",x)
        {
            let x=10
            document.write("<br>The value of x inside the block = ",x)
        }
        document.write("<br>The value of x= ",x)
        document.write("<br><br><br>")
        const y=20
        document.write("<br>The value of y= ",y)
        {
            const y=10
            document.write("<br>The value of y inside the block = ",y)
        }
        document.write("<br>The value of y= ",y)
        document.write("<br><br>1")
        document.write("<br>1&nbsp;2")
        document.write("<br>1&nbsp;2&nbsp;3")

    </script>
</body>
</html>
