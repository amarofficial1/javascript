<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document.write</title>
</head>
<body>
    <h1>External js</h1>
    <h3>get element by id</h3>
    <p id="external"></p>
    <h1>Internal js</h1>
    <script src="external.js"></script>
    <script>
        document.write("<br>3+4-1 = ",3+4-1)
        document.write("<br>")
        document.write("<br> (3*5)+1 = ", (3*5)+1)
        document.write("<br>")
        document.write("<br> (5*2)/2 = ", (5*2)/2)
        document.write("<br>")
        document.write("<br> 10*2+3-1 = ", (10*2)+(3-1))
        document.write("<br>")
        document.write("<br> 10%2 = ", 10%2)
        document.write("<br>")
        document.write("<br> 17%2 = ", 17%2)
        document.write("<br>")
        document.write("<br> (5*6)%4 = ", (5*6)%4)
        document.write("<br>")
        document.write("<br>3.5+2.4 = ", 3.5+2.4)
        document.write("<br>")
        document.write("<br> 104.5/5 = ", 104.5/5)
        document.write("<br>")
        document.write("<br> 4.5*2 = ", 4.5*2)

        console.log("3+4-1 = ",3+4-1)
        console.log(" (3*5)+1 = ", (3*5)+1)
        console.log(" (5*2)/2 = ", (5*2)/2)
        console.log(" 10*2+3-1 = ", (10*2)+(3-1))
        console.log(" 10%2 = ", 10%2)
        console.log(" 17%2 = ", 17%2)
        console.log(" (5*6)%4 = ", (5*6)%4)
        console.log("3.5+2.4 = ", 3.5+2.4)
        console.log(" 104.5/5 = ", 104.5/5)
        console.log(" 4.5*2 = ", 4.5*2)

    </script>
</body>
</html>
